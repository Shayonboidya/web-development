<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-gray-100">

     <div class="min-h-screen flex items-center justify-center p-6">

        <!-- Login Card -->
        <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-lg p-8">

            <!-- Heading -->
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-gray-900">
                    Welcome Back
                </h1>

                <p class="mt-2 text-gray-500">
                    Login to your account
                </p>
            </div>

            <!-- Login Form -->
            <form>

                <!-- Email -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="you@example.com"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200"
                    >
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="••••••••"
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-none focus:border-gray-500 focus:ring-2 focus:ring-gray-200"
                    >
                </div>

                <!-- Remember + Forgot -->
                <div class="flex items-center justify-between mb-6">

                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="text-sm font-medium text-gray-900 hover:underline">
                        Forgot password?
                    </a>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-gray-900 text-white py-3 rounded-lg font-semibold hover:bg-gray-700"
                >
                    Login
                </button>

            </form>

            <!-- Sign Up -->
            <p class="text-center text-sm text-gray-500 mt-6">
                Don't have an account?

                <a href="#" class="font-semibold text-gray-900 hover:underline">
                    Sign up
                </a>
            </p>

        </div>

    </div>
</body>

</html>
