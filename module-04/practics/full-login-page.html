<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>Login page</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            background-image: url("images/backgroundimage.png");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .login{
            border: 1px solid rgba(255 , 255, 255 , 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 1px 5px 20px rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 20px;
        }
        .login h1{
            text-align: center;
            font-size: 2rem;
            color: #ffffff;
        }
        .input-box{
            position: relative;
            width: 100%;
            height: 30px;
            margin: 10px 0;
        }
        .input-box input{
            height: 100%;
            width: 100%;
            background-color: transparent;
            border: none;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            font-size: 1rem;
            color: #ffffff;
            padding: 10px 45px 10px 20px ;
        }
        .input-box input::placeholder{
            color: #ffffff;
            padding: 5px;
        }
        .input-box i{
            position: absolute;
            right: 20px;
            top: 50%;
            color: #ffffff;
            transform: translateY(-50%);
        }
        .remember-forget{
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            color:#ffffff;
        }
        .remember-forget a{
            text-decoration: none;
            color:#ffffff;
        }
        .remember-forget a:hover{
            text-decoration: underline;
        }
        .button{
            width: 100%;
            padding: 8px 14px;
            font-size: .8rem;
            border-radius: 20px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            box-shadow: 1px 1px 30px rgba(0, 0, 0, 0.4);
            font-weight: 700;
            margin: 10px 0;
            transition: 0.3s;
        }
        .button:hover{
            box-shadow: 1px 1px 30px rgba(105, 190, 218, 0.4);
            transform: translateY(-2px);
            
        }
        .reg-link{
            color: #ffffff;
            text-align: center;

        }
        .reg-link p a{
            font-size: 1rem;
            text-decoration: none;
            color: #ffffff;
        }
        .reg-link p a:hover{
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="login">

            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" required placeholder="username">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" required placeholder="password">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="remember-forget">
                    <label><input type="checkbox" name="" id="">Remenber me</label>
                    <a href="#">Forget password?</a>
                </div>
                <button type="submit" class="button">Login</button>
                <div class="reg-link">
                    <p>Don't have any account? <a href="#">Register</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
