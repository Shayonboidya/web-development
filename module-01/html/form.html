<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>making form</title>
</head>
<body>
    <fieldset>

        <form action="">
            
            <label for="">First Name</label>
            <input type="text" placeholder="First Name" required><br>
    
            <label for="">Last Name</label>
            <input type="text" placeholder="Last Name" required><br>
    
    
            <label for="">password</label>
            <input type="password" placeholder="password" required><br>
    
            <label for="">E-mail</label>
            <input type="email" name="" id="" placeholder=".......@gmail.com" required><br>
    
            <label for="">Contuct Number</label>
            <input type="number" placeholder="number" required><br>
    
            <label for="">Date</label>
            <input type="date"><br>
            
            <label for="">color</label>
            <input type="color"><br>
            <label for="">attechment</label>
            <input type="file"><br>
    
            <label for="">url</label>
            <input type="url"><br>
    
            <label for="">range</label>
            <input type="range"><br>
    
            <select name="" id="">
                <option value="">your fav subject</option>
                <option value="">CCE</option>
                <option value="">CIT</option>
                <option value="">EEE</option>
                <option value="">PHY</option>
            </select><br>
    
    
            <label for="">description</label><br>
            <textarea name="" id=""></textarea>
    
    
            <br><br>
            <button type="submit">submit</button>
            <button type="reset">reset</button>
    
    
        </form>
    </fieldset>
    
</body>
</html>
